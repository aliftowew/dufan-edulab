name: Terbitkan ke GitHub Pages

on:
  push:
    branches: [claude/tender-allen-v2l7a3]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Satu penerbitan berjalan pada satu waktu; antrean tidak dibatalkan di tengah jalan.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  terbitkan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.terbit.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Siapkan Pages
        uses: actions/configure-pages@v5
        with:
          # Nyalakan Pages otomatis bila belum aktif di setelan repositori.
          enablement: true
      - name: Unggah isi situs
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Terbitkan
        id: terbit
        uses: actions/deploy-pages@v4
