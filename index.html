<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peta Dufan — Dunia Fantasi Ancol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --panel:#FBF6EC;--text:#1E2A32;--muted:#5F6E78;--line:#E6DCCB;--chip:#F0E9DC;
  --red:#E63946;--red-soft:#FFE1E4;--blue:#2D6CDF;--blue-soft:#DCE8FF;--green:#2F9E63;--green-soft:#D8F3E3;
  --ground:#CFE8B6;--ground2:#BCDFA0;--ground3:#E2F1CB;
  --water:#6FC3E8;--water2:#3EA8D9;--water3:#A8DDF2;--sand:#F3E4BE;--sand2:#E0C894;
  --path:#F6EBD4;--path-edge:#D9C7A3;--path-line:#FFFDF6;--plaza:#E9E3D7;--road:#B9BFC7;
  --tree:#79BE72;--tree2:#5CA457;--tree-lit:#A6DC95;--trunk:#9B7149;
  --pond:#7FD0EF;--pond2:#C9EEFB;--wall:#FAF3E6;--wall2:#E3D6BE;--lamp:#FFC94D;--shade:rgba(30,42,50,.14);
  --lbl:#1E2A32;--halo:#FFFFFF;--zlbl:#324351;--zone-op:.9;--wave:rgba(255,255,255,.6);
  --shadow:0 10px 30px rgba(30,42,50,.18);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --panel:#17201B;--text:#EEF3F2;--muted:#A3B1B8;--line:#2B3A32;--chip:#24302A;
    --red:#FF6B6B;--red-soft:#3A1F22;--blue:#7FA9FF;--blue-soft:#1E2A44;--green:#6FD39A;--green-soft:#1B3527;
    --ground:#1C3527;--ground2:#172D21;--ground3:#244031;
  --water:#0E2C45;--water2:#092038;--water3:#1B4A6B;--sand:#5C5138;--sand2:#4A412D;
  --path:#4C4234;--path-edge:#3A3127;--path-line:#625540;--plaza:#25302B;--road:#44515A;
  --tree:#2F6B3F;--tree2:#255632;--tree-lit:#3E8A52;--trunk:#5B4530;
  --pond:#17405E;--pond2:#2A6D94;--wall:#3A4038;--wall2:#2C322B;--lamp:#C9A14B;--shade:rgba(0,0,0,.34);
    --lbl:#F2F6F8;--halo:#0F1A14;--zlbl:#DDE6EC;--zone-op:.32;--wave:rgba(255,255,255,.22);
    --shadow:0 10px 30px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --panel:#17201B;--text:#EEF3F2;--muted:#A3B1B8;--line:#2B3A32;--chip:#24302A;
  --red:#FF6B6B;--red-soft:#3A1F22;--blue:#7FA9FF;--blue-soft:#1E2A44;--green:#6FD39A;--green-soft:#1B3527;
  --ground:#1C3527;--ground2:#172D21;--ground3:#244031;
  --water:#0E2C45;--water2:#092038;--water3:#1B4A6B;--sand:#5C5138;--sand2:#4A412D;
  --path:#4C4234;--path-edge:#3A3127;--path-line:#625540;--plaza:#25302B;--road:#44515A;
  --tree:#2F6B3F;--tree2:#255632;--tree-lit:#3E8A52;--trunk:#5B4530;
  --pond:#17405E;--pond2:#2A6D94;--wall:#3A4038;--wall2:#2C322B;--lamp:#C9A14B;--shade:rgba(0,0,0,.34);
  --lbl:#F2F6F8;--halo:#0F1A14;--zlbl:#DDE6EC;--zone-op:.32;--wave:rgba(255,255,255,.22);
  --shadow:0 10px 30px rgba(0,0,0,.55);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{height:100%;margin:0;position:relative;overflow:hidden;background:var(--ground);color:var(--text);
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;cursor:grab}
#stage:active{cursor:grabbing}
#map{width:100%;height:100%;display:block;background:var(--ground)}

/* ---------- map artwork ---------- */
.ground{fill:var(--ground)}
.meadow path{fill:var(--ground2);opacity:.5}
.meadow path:nth-child(even){fill:var(--ground3);opacity:.6}
.sea{fill:url(#seaGrad)}
#seaGrad .s1{stop-color:var(--water2)} #seaGrad .s2{stop-color:var(--water)}
.foam{fill:none;stroke:var(--water3);stroke-width:3.5;opacity:.8}
.sand{fill:var(--sand)}
.sand2{fill:none;stroke:var(--sand2);stroke-width:2.6;opacity:.75}
.hullc{fill:#FF9F43} .sailc{fill:#fff}
.plaza{fill:var(--plaza)} .road{fill:var(--road)}
.roadline{fill:none;stroke:#fff;stroke-width:1.5;stroke-dasharray:10 10;opacity:.7}
.bay path{stroke:#fff;stroke-width:1.4;opacity:.4}
.paths{fill:none;stroke-linecap:round;stroke-linejoin:round}
.paths.case{stroke:var(--path-edge);stroke-width:21}
.paths.main{stroke:var(--path);stroke-width:16}
.paths.dash{stroke:var(--path-line);stroke-width:1.6;stroke-dasharray:7 10;opacity:.7}
.zone{opacity:var(--zone-op)}
.zone-edge{fill:none;stroke-width:2.2;stroke-dasharray:9 8;opacity:calc(var(--zone-op) * .75)}
.indoor .ibody{fill:var(--wall);stroke:var(--wall2);stroke-width:2}
.indoor .iroof{fill:#64B5F6;opacity:.9}
.indoor .iwin rect{fill:var(--water3)}
.indoor .idoor{fill:var(--wall2)}
.pond{fill:var(--pond)}
.pond-rim{fill:none;stroke:var(--pond2);stroke-width:2;opacity:.85}
.lily ellipse{fill:var(--tree2)}
.tree .trunk{fill:var(--trunk)}
.tree .tree1{fill:var(--tree)} .tree .tree2{fill:var(--tree2)} .tree .tlit{fill:var(--tree-lit)}
.tshade{fill:var(--shade)}
.trunkc{fill:none;stroke:var(--trunk);stroke-width:2.4;stroke-linecap:round}
.palmleaf{fill:none;stroke:var(--tree2);stroke-width:2.6;stroke-linecap:round}
.lamp .lpole{fill:var(--road)} .lamp .lglow{fill:var(--lamp);opacity:.28} .lamp .lbulb{fill:var(--lamp)}
.prop .wall{fill:var(--wall)} .prop .wall2{fill:var(--wall2)}
.prop .wood{fill:var(--trunk)} .prop .wood2{fill:var(--wall2)}
.rshadow{fill:var(--shade);pointer-events:none}
.splate{fill:#FBF6EC;stroke:#D9C7A3;stroke-width:2}
.spost{fill:var(--road)}
.zlbl{stroke:var(--halo);stroke-width:3.2px;paint-order:stroke;stroke-linejoin:round;font:700 13px 'Plus Jakarta Sans',sans-serif;fill:var(--zlbl);text-anchor:middle;letter-spacing:.4px;pointer-events:none}
.zlbl.small{font-size:11px;font-weight:600;opacity:.85}
.sea-lbl{font:600 11px 'Plus Jakarta Sans',sans-serif;fill:#fff;opacity:.8;text-anchor:middle;letter-spacing:3px}
.lbl{font:600 9.5px 'Plus Jakarta Sans',sans-serif;fill:var(--lbl);text-anchor:middle;stroke:var(--halo);stroke-width:3px;paint-order:stroke;stroke-linejoin:round}
.lbl.big{font-size:11px;font-weight:700}
.hit{fill:#fff;fill-opacity:0;pointer-events:all}
.ride,.landmark{cursor:pointer;transition:opacity .25s}
.ride.dim{opacity:.16;pointer-events:none}
.pv{fill:none;stroke:none}
.wave{fill:none;stroke:var(--wave);stroke-width:2}
.closed > :not(.tag):not(.lbl){opacity:.45}
.sel{fill:none;stroke:var(--red)}

/* ---------- animations ---------- */
.a{transform-box:fill-box;transform-origin:center}
.spin{animation:spin 3.2s linear infinite}
.spin.slow{animation-duration:10s}.spin.mid{animation-duration:5s}.spin.fast{animation-duration:1.3s}.spin.fast2{animation-duration:2s}
.spin.rev{animation-name:spinrev}
.swing{transform-box:fill-box;transform-origin:50% 0;animation:swing 2.3s ease-in-out infinite alternate}
.swing.sm{animation-name:swingsm;animation-duration:1.8s}
.sweep{transform-box:fill-box;transform-origin:50% 0;animation:sweep 2.6s ease-in-out infinite alternate}
.flagw{transform-box:fill-box;transform-origin:0 50%;animation:flag 1s ease-in-out infinite alternate}
.updown{animation:updown 4s ease-in-out infinite}
.bob{animation:bob 1.2s ease-in-out infinite}
.shoot{animation:shoot 4.2s cubic-bezier(.3,.7,.3,1) infinite}
.shoot.d2{animation-delay:-2.1s}
.drop{animation:drop 4.5s ease-in infinite}
.flk{animation:flicker 2.6s linear infinite}
.blk{animation:blink 1.1s ease-in-out infinite}
.wobble{animation:wobble 1.8s ease-in-out infinite alternate}
.train{animation:train 3s linear infinite}
.splash{animation:splash 3.2s ease-out infinite}
.pop{animation:pop 2.4s ease-in-out infinite}
.bump1{animation:bump1 2.8s ease-in-out infinite}.bump2{animation:bump2 3.4s ease-in-out infinite}.bump3{animation:bump3 2.5s ease-in-out infinite}
.drift{animation:drift 14s ease-in-out infinite alternate}.drift.slow2{animation-duration:20s}
.wave{animation:wave 3s linear infinite}.wave.w2{animation-duration:4.2s}.wave.w3{animation-duration:5.1s}
.snow{animation:snow 2.4s linear infinite}
.shimmer{animation:shimmer 1.6s ease-in-out infinite}
.jolt{animation:jolt .35s linear infinite}
.pulse{animation:pulse 1.6s ease-out infinite}
.d2{animation-delay:-.7s}.d3{animation-delay:-1.4s}
.paused svg *{animation-play-state:paused!important}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinrev{to{transform:rotate(-360deg)}}
@keyframes swing{from{transform:rotate(-55deg)}to{transform:rotate(55deg)}}
@keyframes swingsm{from{transform:rotate(-35deg)}to{transform:rotate(35deg)}}
@keyframes sweep{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}
@keyframes flag{from{transform:rotate(-10deg)}to{transform:rotate(12deg)}}
@keyframes updown{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes shoot{0%{transform:translateY(0)}22%{transform:translateY(-52px)}38%{transform:translateY(-52px)}52%{transform:translateY(-6px)}62%{transform:translateY(-32px)}76%{transform:translateY(0)}100%{transform:translateY(0)}}
@keyframes drop{0%{transform:translateY(0)}40%{transform:translateY(-42px)}55%{transform:translateY(-42px)}62%{transform:translateY(0)}70%{transform:translateY(-12px)}78%{transform:translateY(0)}100%{transform:translateY(0)}}
@keyframes flicker{0%,44%,56%,100%{opacity:1}50%{opacity:.15}70%{opacity:.45}75%{opacity:1}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
@keyframes wobble{from{transform:rotate(9deg)}to{transform:rotate(14deg)}}
@keyframes train{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
@keyframes splash{0%,62%{transform:scale(0);opacity:0}72%{transform:scale(1.6);opacity:.9}100%{transform:scale(2.6);opacity:0}}
@keyframes pop{0%,100%{transform:translateY(0)}30%,60%{transform:translateY(-16px)}}
@keyframes bump1{0%,100%{transform:translate(0,0)}33%{transform:translate(14px,6px)}66%{transform:translate(5px,11px)}}
@keyframes bump2{0%,100%{transform:translate(0,0)}33%{transform:translate(-12px,-4px)}66%{transform:translate(-3px,8px)}}
@keyframes bump3{0%,100%{transform:translate(0,0)}33%{transform:translate(6px,-9px)}66%{transform:translate(-10px,-2px)}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(60px)}}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-48px)}}
@keyframes snow{0%{transform:translateY(-6px);opacity:0}20%{opacity:1}100%{transform:translateY(26px);opacity:0}}
@keyframes shimmer{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes jolt{0%,100%{transform:translate(0,0)}25%{transform:translate(1px,-1px)}50%{transform:translate(-1px,1px)}75%{transform:translate(1px,1px)}}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.7);opacity:0}}
@media (prefers-reduced-motion:reduce){svg .a,svg .swing,svg .sweep,svg .flagw,svg .flk,svg .blk{animation:none}}

/* ---------- UI chrome ---------- */
.bar{position:fixed;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;
  display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:5}
.bar>*{pointer-events:auto}
.title{align-self:flex-start;background:var(--panel);border-radius:14px;padding:8px 14px 9px;box-shadow:var(--shadow);max-width:calc(100% - 64px)}
.title h1{font:600 22px/1.05 'Fraunces',Georgia,serif;margin:0;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.t-logo{height:30px;width:auto;display:block}
.credit{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line)}
.credit img{height:22px;width:auto;display:block}
.credit img.c-ancol{height:17px}
.title .sub{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;border-radius:999px;padding:7px 12px;font:600 12px 'Plus Jakarta Sans',sans-serif;background:var(--panel);color:var(--text);box-shadow:var(--shadow);cursor:pointer}
.chip.active{background:var(--text);color:var(--panel)}
.seg{display:inline-flex;gap:3px;padding:3px;border-radius:999px;background:var(--panel);box-shadow:var(--shadow)}
.seg .chip{background:transparent;box-shadow:none;padding:6px 13px}
.chip b{font-weight:600;margin-left:5px}
.seg .chip.active{background:var(--text);color:var(--panel)}
.ctrl{display:flex;gap:6px}
.ctrl button{width:36px;height:36px;border:0;border-radius:10px;background:var(--chip);color:var(--text);font:600 18px 'Plus Jakarta Sans',sans-serif;cursor:pointer;display:grid;place-items:center}
.chip:focus-visible,.btn:focus-visible,.ctrl button:focus-visible,.card:focus-visible,.grab:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,560px);background:var(--panel);color:var(--text);
  border-radius:20px 20px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.18);padding:6px 16px calc(14px + env(safe-area-inset-bottom,0px));
  z-index:6;display:flex;flex-direction:column;max-height:62%}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 8px;flex:none;border:0;padding:0;display:block;cursor:pointer}
.peek-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none}
.hint{font-size:12px;color:var(--muted);line-height:1.35;margin:0 0 8px}
.content{overflow:auto;-webkit-overflow-scrolling:touch;padding:8px 0 4px;touch-action:pan-y}
.sheet.peek .content{display:none}
.sheet:not(.peek) .hint{display:none}
.btn{border:0;border-radius:999px;padding:9px 14px;font:600 13px 'Plus Jakarta Sans',sans-serif;background:var(--text);color:var(--panel);cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block;line-height:1.2}
.btn.small{padding:7px 12px;font-size:12px}
.btn.ghost{background:var(--chip);color:var(--text)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--text)}
.tag.ekstrem{background:var(--red-soft);color:var(--red)}
.tag.keluarga{background:var(--blue-soft);color:var(--blue)}
.tag.anak{background:var(--green-soft);color:var(--green)}
.tag.closed{background:var(--red);color:#fff}
.content h2{font:600 24px/1.1 'Fraunces',Georgia,serif;margin:2px 0 6px}
.meta{margin:0 0 2px;font-size:13px;color:var(--muted)}
.dots{color:var(--red);letter-spacing:1px}
.desc{margin:8px 0 12px;font-size:14px;line-height:1.5;max-width:60ch}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.list h3{font:600 15px 'Fraunces',Georgia,serif;margin:8px 0 6px}
.list h3:first-child{margin-top:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.card{position:relative;border:0;border-radius:14px;padding:12px 5px 9px;background:var(--chip);color:var(--text);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;overflow:hidden;transition:transform .16s ease,box-shadow .16s ease}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--red)}
.card.keluarga::before{background:var(--blue)}
.card.anak::before{background:var(--green)}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.card .art{width:100%;height:58px;display:block}
.card .art svg{width:100%;height:100%;display:block;overflow:visible}
svg.still *{animation:none!important}
.card .cname{font:600 11px/1.25 'Plus Jakarta Sans',sans-serif;text-align:center}
.card .czone{font-size:9.5px;color:var(--muted);line-height:1.2}
.card.closed .art,.card.closed .cname{opacity:.5}
.card .cbadge{margin-top:2px;font-size:9px;font-weight:700;letter-spacing:.3px;padding:2px 6px;border-radius:999px;background:var(--red);color:#fff}
.hero{margin:10px 0 2px;border-radius:16px;background:var(--chip);padding:4px 4px 0;overflow:hidden}
.hero .art{display:block;height:170px}
.hero .art svg{width:100%;height:100%;display:block;overflow:visible}
.hero-cap{margin:0;padding:2px 10px 8px;font-size:11px;color:var(--muted);text-align:center}
.shot{margin:10px 0 2px}
.shot img{width:100%;border-radius:12px;display:block}
.shot figcaption{margin-top:5px;font-size:11px;color:var(--muted);line-height:1.4}
.shot.empty{border:1px dashed var(--line);border-radius:12px;padding:18px 14px;text-align:center;font-size:12px;color:var(--muted);line-height:1.5}
h4.ph{font:700 11px 'Plus Jakarta Sans',sans-serif;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:16px 0 2px}
.note{font-size:12px;color:var(--muted);margin:12px 0 0;line-height:1.4}

/* MathJax SVG output */
mjx-container[jax="SVG"] {
  direction: ltr;
}

mjx-container[jax="SVG"] > svg {
  overflow: visible;
  min-height: 1px;
  min-width: 1px;
}

mjx-container[jax="SVG"] > svg a {
  fill: blue;
  stroke: blue;
}

mjx-container[jax="SVG"][display="true"] {
  display: block;
  text-align: center;
  margin: 1em 0;
}

mjx-container[jax="SVG"][display="true"][width="full"] {
  display: flex;
}

mjx-container[jax="SVG"][justify="left"] {
  text-align: left;
}

mjx-container[jax="SVG"][justify="right"] {
  text-align: right;
}

g[data-mml-node="merror"] > g {
  fill: red;
  stroke: red;
}

g[data-mml-node="merror"] > rect[data-background] {
  fill: yellow;
  stroke: none;
}

g[data-mml-node="mtable"] > line[data-line], svg[data-table] > g > line[data-line] {
  stroke-width: 70px;
  fill: none;
}

g[data-mml-node="mtable"] > rect[data-frame], svg[data-table] > g > rect[data-frame] {
  stroke-width: 70px;
  fill: none;
}

g[data-mml-node="mtable"] > .mjx-dashed, svg[data-table] > g > .mjx-dashed {
  stroke-dasharray: 140;
}

g[data-mml-node="mtable"] > .mjx-dotted, svg[data-table] > g > .mjx-dotted {
  stroke-linecap: round;
  stroke-dasharray: 0,140;
}

g[data-mml-node="mtable"] > g > svg {
  overflow: visible;
}

[jax="SVG"] mjx-tool {
  display: inline-block;
  position: relative;
  width: 0;
  height: 0;
}

[jax="SVG"] mjx-tool > mjx-tip {
  position: absolute;
  top: 0;
  left: 0;
}

mjx-tool > mjx-tip {
  display: inline-block;
  padding: .2em;
  border: 1px solid #888;
  font-size: 70%;
  background-color: #F8F8F8;
  color: black;
  box-shadow: 2px 2px 5px #AAAAAA;
}

g[data-mml-node="maction"][data-toggle] {
  cursor: pointer;
}

mjx-status {
  display: block;
  position: fixed;
  left: 1em;
  bottom: 1em;
  min-width: 25%;
  padding: .2em .4em;
  border: 1px solid #888;
  font-size: 90%;
  background-color: #F8F8F8;
  color: black;
}

foreignObject[data-mjx-xml] {
  font-family: initial;
  line-height: normal;
  overflow: visible;
}

mjx-container[jax="SVG"] path[data-c], mjx-container[jax="SVG"] use[data-c] {
  stroke-width: 3;
}

/* ---------- fisika & lab mini ---------- */
.sheet:not(.peek){max-height:80%}
.photo{width:100%;border-radius:12px;margin:8px 0;display:block}
.phys{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.phys h3{font:600 17px 'Fraunces',Georgia,serif;margin:0 0 2px}
.konsep{margin:0 0 6px;font-size:13px;color:var(--muted)}
.formulas{margin:8px 0}
.fx{display:flex;flex-direction:column;gap:2px;padding:8px 10px;margin:6px 0;border-radius:10px;background:var(--chip)}
.fx-svg{overflow-x:auto;font-size:15px;color:var(--text);padding:2px 0}
.fx-svg mjx-container[jax="SVG"][display="true"]{margin:2px 0;text-align:left}
.fx .cap{font-size:12px;color:var(--muted)}
.fx-raw{font-size:12px;word-break:break-all}
.lab{margin:10px 0;padding:10px;border-radius:12px;background:var(--chip)}
.lab-head{font-weight:700;font-size:13px}
.lab-tip{margin:2px 0 8px;font-size:12px;color:var(--muted);line-height:1.4}
.lab-scene{width:100%;height:auto;display:block;background:var(--panel);border-radius:10px;touch-action:none}
.lab-ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-end;margin:10px 0 6px}
.lab-ctl label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);flex:1 1 150px;gap:2px}
.lab-ctl label b{color:var(--text)}
.lab-ctl input[type=range]{width:100%;accent-color:var(--red);margin:0}
.lab-read{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:2px 14px;font-size:12px;margin:6px 0}
.lab-read div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding:4px 0}
.lab-read b{white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.ebars{margin-top:8px}
.ebar{display:grid;grid-template-columns:34px 1fr 72px;align-items:center;gap:8px;font-size:12px;margin:4px 0}
.ebar i{display:block;height:10px;border-radius:5px;background:var(--red);transition:width .08s linear;min-width:2px}
.ebar.ek i{background:var(--blue)}
.ebar b{text-align:right;font-variant-numeric:tabular-nums}
.lab-scene .ln{stroke:var(--muted);stroke-width:2}
.lab-scene .frame{fill:none;stroke:#A1735B;stroke-width:3}
.lab-scene .arc{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:4 4}
.lab-scene .hline{stroke:var(--red);stroke-width:1.5;stroke-dasharray:3 3}
.lab-scene .arm{stroke:#A1735B;stroke-width:3}
.lab-scene .boat{fill:#C0392B}.lab-scene .mast{fill:#FFD93D}.lab-scene .pivot{fill:var(--text)}
.lab-scene .grab{cursor:grab}
.lab-scene .sl{font:600 10px 'Plus Jakarta Sans',sans-serif;fill:var(--text)}
.lab-scene .sl.big{font-size:14px}.lab-scene .warn{fill:var(--red)}
.lab-scene .track{fill:none;stroke:#E63946;stroke-width:3;stroke-linejoin:round}
.lab-scene .cart{fill:#1E2A32}.lab-scene .wheel{fill:#FFD93D;stroke:#1E2A32;stroke-width:1}
.lab-scene .water{fill:#2D6CDF;opacity:.45}.lab-scene .wline{stroke:#2D6CDF;stroke-width:2}
.lab-scene .plat{fill:#FFEAA7;stroke:#FDCB6E;stroke-width:2}.lab-scene .spoke{stroke:#FDCB6E;stroke-width:1.5}
.lab-scene .seat{fill:#E63946}
.lab-scene .arrA line{stroke:#E63946;stroke-width:2.5}.lab-scene .arrA path{fill:#E63946}
.lab-scene .arrV line{stroke:#2D6CDF;stroke-width:2.5}.lab-scene .arrV path{fill:#2D6CDF}
.lab-scene .tower{stroke:#8FA3AD;stroke-width:8;fill:#8FA3AD}
.lab-scene .chain{stroke:#57606F;stroke-width:2}.lab-scene .seatr{fill:#E63946}
.lab-scene .meter{fill:none;stroke:var(--muted);stroke-width:1.5}.lab-scene .meterfill{fill:#E63946;opacity:.85}
.lab-scene .car{fill:#FF6B6B}.lab-scene .rider{fill:#2D6CDF}
.lab-scene .carA{fill:#E63946}.lab-scene .carB{fill:#2D6CDF}.lab-scene .carlbl{fill:#fff}
.lab-scene .hull{fill:#A1735B;stroke:#6D4C41;stroke-width:2}
.lab-scene .plane{fill:#FFEAA7;stroke:#FDCB6E;stroke-width:2}.lab-scene .ballc{fill:#E63946}
/* ---------- panel jadi sidebar di layar lanskap ---------- */
@media (orientation:landscape) and (min-width:640px){
  .bar{max-width:min(78vw,900px);flex-direction:row;flex-wrap:wrap;align-items:center}
  body.sidebar .bar{max-width:min(48vw,540px)}
  .title{padding:6px 12px 7px}
  .title h1{font-size:17px}
  .t-logo{height:21px}
  .title .sub{display:none}
  .chip[data-cat] b{display:none}
  .chip[data-cat]{padding:7px 11px;font-size:14px}
  #stage{transition:right .28s ease}
  body.sidebar #stage{right:clamp(330px,38vw,430px)}
  .sheet{left:auto;right:0;top:0;bottom:0;transform:none;height:100%;width:clamp(330px,38vw,430px);
    max-height:none;border-radius:18px 0 0 18px;box-shadow:-8px 0 30px rgba(0,0,0,.25);
    padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(12px + env(safe-area-inset-bottom,0px))}
  .sheet:not(.peek){max-height:none}
  .sheet.peek{top:auto;height:auto;width:auto;max-width:min(360px,52vw);border-radius:16px 0 0 0}
  .grab{display:none}
  .sheet .hint{margin:0 0 8px}
}
.sheet.peek #listBtn{display:none}

  tembak: {

    text: [
      ["Cara kerjanya", "Senapan memancarkan berkas inframerah sempit, dan tiap sasaran dipasangi fotodioda yang menghasilkan arus kecil ketika terkena cahaya itu. Rangkaian di dalam sasaran memperkuat arus itu dan menghitungnya sebagai satu tembakan sah."],
      ["Fisika yang bekerja", "Fotodioda bekerja lewat efek fotolistrik: foton yang datang membebaskan pembawa muatan di dalam bahan semikonduktor, dan muatan itu mengalir sebagai arus yang sebanding dengan terang cahaya yang diterima. Sensor hanya peka pada panjang gelombang inframerah agar lampu ruangan tidak ikut terhitung."],
      ["Tidak ada peluru, tidak ada parabola", "Peluru sungguhan jatuh mengikuti lintasan parabola dan butuh koreksi sesuai jarak. Cahaya praktis tiba seketika dan lintasannya lurus, jadi keterampilan yang diuji berubah total: bukan menghitung jarak, melainkan menstabilkan bidikan dan bereaksi cepat."],
      ["Batasnya ada di tubuhmu", "Waktu reaksi manusia dari melihat sampai jari menekan pelatuk sekitar 0,2 detik, dan itu jauh lebih lama daripada waktu tempuh cahaya. Karena itu skor hampir sepenuhnya ditentukan seberapa stabil tanganmu memegang senapan dan seberapa cepat matamu memutuskan."]

  teater: {

      ["Fisika yang bekerja", "Otolit di telinga dalam sebenarnya tidak bisa membedakan percepatan dari kemiringan. Keduanya menghasilkan arah gaya yang sama relatif terhadap kepala. Prinsip ini punya nama, yaitu kesetaraan antara percepatan dan gravitasi, dan merupakan gagasan yang sama yang dipakai Einstein sebagai titik awal teori relativitas umum."],
      ["Kenapa trik ini berhasil", "Layar besar mengisi hampir seluruh bidang pandang dan memberitahu otak bahwa kamu sedang melaju ke depan. Platform lalu memiringkan kursi ke belakang perlahan, cukup lambat agar tidak terasa sebagai kemiringan. Otak menerima dua masukan yang cocok satu sama lain dan menyimpulkan satu-satunya penjelasan yang masuk akal: tubuh sedang dipercepat ke depan."],
      ["Dipakai juga untuk hal serius", "Simulator latihan pilot memakai mekanisme yang identik dan disebut tilt coordination. Pesawat latih di darat hanya miring beberapa derajat, tetapi pilot merasakan akselerasi lepas landas yang meyakinkan, sehingga latihan bisa dilakukan tanpa terbang sungguhan."]

    f: [

      ["Cara kerjanya", "Sekelompok burung logam berputar mengelilingi poros pusat. Tiap penumpang memegang tuas yang mengatur silinder hidraulik, sehingga burungnya bisa dinaikkan atau diturunkan sampai sekitar 15 meter sambil terus berputar."],
      ["Fisika yang bekerja", "Saat tuas ditarik, pompa mendorong oli ke dalam silinder. Karena zat cair praktis tidak bisa dimampatkan, tekanan yang diberikan diteruskan sama besar ke seluruh bagian fluida. Itulah hukum Pascal, dan itulah yang membuat gaya kecil pada tuas sanggup mengangkat kursi berisi orang."],

      ["Coba di lab", "Model memakai jari-jari 8 meter. Ubah rpm dan bandingkan laju dalam km per jam dengan berat semu. Wahana ini tetap ramah keluarga karena rpm-nya dijaga rendah walau jari-jarinya besar."]

      ["Coba di lab", "Naikkan rpm dari nol sampai maksimum dan perhatikan berat semu hampir tidak beranjak dari 1 g. Bandingkan dengan Tornado atau Rajawali untuk melihat betapa jauh jaraknya."]

      ["Fisika yang bekerja", "Benda mengapung kalau massa jenis rata-ratanya lebih kecil daripada massa jenis air. Perahu terbuat dari bahan yang lebih berat daripada air, tetapi sebagian besar isinya udara, sehingga massa jenis rata-ratanya jatuh jauh di bawah seribu kilogram per meter kubik."],

<script>
var DufanPhysics = (function () {
  'use strict';
  var G = 9.8, M = 70, NS = 'http://www.w3.org/2000/svg';
  var LABEL = {pendulum: 'Ayunan bandul', coaster: 'Kereta di lintasan', circular: 'Gerak melingkar', drop: 'Menara jatuh bebas', collision: 'Tabrakan bumper car', buoy: 'Gaya apung', incline: 'Bidang miring'};

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); }
  function fnum(x, d) {
    if (!isFinite(x)) return '–';
    if (d === undefined) d = 1;
    var s = (Math.abs(x) >= 1000 ? Math.round(x).toString() : x.toFixed(d)).replace('.', ',');
    var parts = s.split(','); parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return parts.join(',');
  }
  function add(parent, tag, attrs) { var e = document.createElementNS(NS, tag); if (attrs) for (var k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; }
  function fm(tex) { var s = (typeof FSVG !== 'undefined') && FSVG[tex]; return s ? '<div class="fx-svg">' + s + '</div>' : '<code class="fx-raw">' + esc(tex) + '</code>'; }

  function labHTML(id) {
    var p = (typeof PHYS !== 'undefined') && PHYS[id];
    return (p && p.lab) ? '<div class="lab" data-id="' + id + '"></div>' : '';
  }
  function section(id, photo) {
    var p = (typeof PHYS !== 'undefined') && PHYS[id]; if (!p) return '';
    var h = '<div class="phys"><h3>Fisika di balik wahana</h3><p class="konsep">' + esc(p.konsep) + '</p>' + (photo || '');
    var t = typeof p.text === 'string' ? [p.text] : p.text;
    t.forEach(function (x) {
      if (typeof x === 'string') h += '<p class="desc">' + esc(x) + '</p>';
      else h += '<h4 class="ph">' + esc(x[0]) + '</h4><p class="desc">' + esc(x[1]) + '</p>';
    });
    h += '<h4 class="ph">Rumus yang dipakai</h4><div class="formulas">';
    p.f.forEach(function (f) { h += '<div class="fx">' + fm(f[0]) + '<span class="cap">' + esc(f[1]) + '</span></div>'; });
    h += '</div>';
    h += '<p class="note">' + (p.note ? esc(p.note) + ' ' : '') + 'Model sederhana untuk belajar: gesekan diabaikan kecuali disebut, g = 9,8 m/s², massa penumpang 70 kg.</p></div>';
    return h;
  }

  /* ---------- shared lab UI ---------- */
  function shell(host, type, tip) {
    host.innerHTML = '<div class="lab-head">Lab mini: ' + LABEL[type] + '</div><p class="lab-tip">' + tip + '</p>'
      + '<svg class="lab-scene" viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"></svg>'
      + '<div class="lab-ctl"></div><div class="lab-read"></div><div class="ebars"></div>';
    return {scene: host.querySelector('svg'), ctl: host.querySelector('.lab-ctl'), read: host.querySelector('.lab-read'), ebars: host.querySelector('.ebars')};
  }
  function slider(ctl, label, min, max, step, val, unit) {
    var lab = document.createElement('label');
    lab.innerHTML = '<span>' + label + ' <b></b></span><input type="range" min="' + min + '" max="' + max + '" step="' + step + '" value="' + val + '">';
    ctl.appendChild(lab);
    var inp = lab.querySelector('input'), out = lab.querySelector('b');
    function show() { out.textContent = fnum(parseFloat(inp.value), step < 1 ? (step < 0.1 ? 2 : 1) : 0) + (unit || ''); }
    inp.addEventListener('input', show); show();
    return inp;
  }
  function button(ctl, text, ghost) { var b = document.createElement('button'); b.className = 'btn small' + (ghost ? ' ghost' : ''); b.type = 'button'; b.textContent = text; ctl.appendChild(b); return b; }
  function reads(container, keys) {
    container.innerHTML = keys.map(function (k) { return '<div><span>' + k + '</span><b>–</b></div>'; }).join('');
    var bs = container.querySelectorAll('b');
    return function (vals) { for (var i = 0; i < vals.length; i++) bs[i].textContent = vals[i]; };
  }
  function bars(container) {
    container.innerHTML = '<div class="ebar ep"><span>E<sub>p</sub></span><i></i><b></b></div><div class="ebar ek"><span>E<sub>k</sub></span><i></i><b></b></div>';
    var ip = container.querySelector('.ep i'), bp = container.querySelector('.ep b'), ik = container.querySelector('.ek i'), bk = container.querySelector('.ek b');
    return function (ep, ek, max) {
      max = Math.max(max, 1);
      ip.style.width = Math.min(100, ep / max * 100) + '%'; ik.style.width = Math.min(100, ek / max * 100) + '%';
      bp.textContent = fnum(ep / 1000, 2) + ' kJ'; bk.textContent = fnum(ek / 1000, 2) + ' kJ';
    };
  }
  function scenePt(scene, e) { var r = scene.getBoundingClientRect(); return {x: (e.clientX - r.left) * 320 / r.width, y: (e.clientY - r.top) * 200 / r.height}; }
  function arrow(parent, x1, y1, x2, y2, cls) {
    var g = add(parent, 'g', {'class': cls});
    add(g, 'line', {x1: x1, y1: y1, x2: x2, y2: y2});
    var a = Math.atan2(y2 - y1, x2 - x1), L = 7;
    add(g, 'path', {d: 'M' + x2 + ',' + y2 + ' L' + (x2 - L * Math.cos(a - 0.5)) + ',' + (y2 - L * Math.sin(a - 0.5)) + ' L' + (x2 - L * Math.cos(a + 0.5)) + ',' + (y2 - L * Math.sin(a + 0.5)) + ' Z'});
    return g;
  }
  function loop(fn) { // rAF loop with dt
    var raf = 0, last = 0, on = false;
    function step(t) { if (!on) return; var dt = Math.min(0.04, (t - last) / 1000); last = t; fn(dt); raf = requestAnimationFrame(step); }
    return {start: function () { if (on) return; on = true; last = performance.now(); raf = requestAnimationFrame(step); }, stop: function () { on = false; cancelAnimationFrame(raf); }, running: function () { return on; }};
  }

  /* ---------- 1. pendulum ---------- */
  function labPendulum(host, p) {
    var ui = shell(host, 'pendulum', 'Ayunan berjalan otomatis. Tarik perahu dengan jari atau geser slider untuk mengubah simpangan, lalu tekan Lepaskan. Perhatikan E<sub>p</sub> dan E<sub>k</sub> bertukar.');
    var sc = ui.scene, L = p.L, thMax = p.thetaMax * Math.PI / 180, px = 160, py = 26, Lpx = 120, groundY = py + Lpx + 14;
    add(sc, 'line', {x1: 10, y1: groundY, x2: 310, y2: groundY, 'class': 'ln'});
    add(sc, 'path', {d: 'M' + (px - 46) + ',' + groundY + ' L' + px + ',' + py + ' L' + (px + 46) + ',' + groundY, 'class': 'frame'});
    var arcD = '', n = 24; for (var i = 0; i <= n; i++) { var a = -thMax + 2 * thMax * i / n; arcD += (i ? ' L' : 'M') + (px + Lpx * Math.sin(a)) + ',' + (py + Lpx * Math.cos(a)); }
    add(sc, 'path', {d: arcD, 'class': 'arc'});
    var hline = add(sc, 'line', {'class': 'hline'}), hlbl = add(sc, 'text', {'class': 'sl'}); hlbl.textContent = 'h';
    var arm = add(sc, 'line', {x1: px, y1: py, 'class': 'arm'});
    var boat = add(sc, 'g', {'class': 'grab'}); boat.innerHTML = '<circle r="22" fill="#fff" fill-opacity="0"/><path d="M-17,-2 Q0,17 17,-2 Z" class="boat"/><rect x="-2" y="-9" width="4" height="8" class="mast"/>';
    add(sc, 'circle', {cx: px, cy: py, r: 4, 'class': 'pivot'});
    var th = thMax * 0.75, om = 0, Emax = M * G * L * (1 - Math.cos(thMax)), syncing = false;
    var sl = slider(ui.ctl, 'Sudut simpangan', 0, p.thetaMax, 1, Math.round(th * 180 / Math.PI), '°');
    var go = button(ui.ctl, 'Lepaskan'), stop = button(ui.ctl, 'Berhenti', true);
    var setR = reads(ui.read, ['Tinggi h', 'Kecepatan v', 'Periode T (sudut kecil)', 'Energi total']), setB = bars(ui.ebars);
    var anim = loop(function (dt) { for (var i = 0; i < 4; i++) { om += -(G / L) * Math.sin(th) * dt / 4; th += om * dt / 4; } draw(); });
    function draw() {
      var x = px + Lpx * Math.sin(th), y = py + Lpx * Math.cos(th), y0 = py + Lpx;
      arm.setAttribute('x2', x); arm.setAttribute('y2', y);
      boat.setAttribute('transform', 'translate(' + x + ',' + y + ') rotate(' + (-th * 180 / Math.PI) + ')');
      hline.setAttribute('x1', x); hline.setAttribute('y1', y0); hline.setAttribute('x2', x); hline.setAttribute('y2', y);
      hlbl.setAttribute('x', x + 6); hlbl.setAttribute('y', (y + y0) / 2 + 4); hlbl.style.display = Math.abs(th) > 0.15 ? '' : 'none';
      var h = L * (1 - Math.cos(th)), v = L * Math.abs(om), Ep = M * G * h, Ek = 0.5 * M * v * v;
      setR([fnum(h, 2) + ' m', fnum(v, 1) + ' m/s (' + fnum(v * 3.6, 0) + ' km/h)', fnum(2 * Math.PI * Math.sqrt(L / G), 1) + ' s', fnum((Ep + Ek) / 1000, 2) + ' kJ']);
      setB(Ep, Ek, Emax);
      if (!anim.running()) { syncing = true; sl.value = Math.round(Math.abs(th) * 180 / Math.PI); sl.dispatchEvent(new Event('input')); syncing = false; }
    }
    sl.addEventListener('input', function () { if (syncing) return; anim.stop(); om = 0; th = parseFloat(sl.value) * Math.PI / 180; draw(); });
    go.addEventListener('click', function () { anim.start(); });
    stop.addEventListener('click', function () { anim.stop(); om = 0; draw(); });
    var dragging = false;
    sc.addEventListener('pointerdown', function (e) { dragging = true; anim.stop(); om = 0; sc.setPointerCapture(e.pointerId); move(e); });
    sc.addEventListener('pointermove', function (e) { if (dragging) move(e); });
    sc.addEventListener('pointerup', function () { dragging = false; }); sc.addEventListener('pointercancel', function () { dragging = false; });
    function move(e) { var q = scenePt(sc, e); th = Math.max(-thMax, Math.min(thMax, Math.atan2(q.x - px, q.y - py))); draw(); }
    draw();

        +(r.closed?'<span class="cbadge">tutup</span>':'')
        +'</button>';});
    h+='</div>';});
  h+='<p class="note">Tata letak peta ini ilustratif. Beberapa wahana bisa tutup untuk perawatan, cek aplikasi atau situs Ancol sebelum datang.</p>'
    +'<div class="credit"><img data-logo="dufan" alt="Dufan"><img class="c-ancol" data-logo="ancol" alt="Ancol"></div>'
    +'<p class="note">Logo Dufan dan Ancol milik PT Pembangunan Jaya Ancol Tbk. Peta ini proyek belajar mandiri, bukan aplikasi resmi.</p></div>';return h;}
function select(id,move){var g=svg.querySelector('[data-id="'+id+'"]');if(!g)return;var r=byId[id]||LANDMARKS[id];if(!r)return;
  var p=posOf(g);selWrap.setAttribute('transform','translate('+p.x+','+p.y+')');selWrap.style.display='';current=id;openSheet(detailHTML(r,id));DufanPhysics.mount(content);if(move)focusOn(p.x,p.y);}
var viewBtns=Array.prototype.slice.call(document.querySelectorAll('[data-view]'));
function setViewBtn(v){viewBtns.forEach(function(b){var on=b.getAttribute('data-view')===v;
  b.classList.toggle('active',on);b.setAttribute('aria-pressed',on?'true':'false');});}
viewBtns.forEach(function(b){b.addEventListener('click',function(){
  if(b.getAttribute('data-view')==='list')openSheet(listHTML());else closeSheet();});});
listBtn.addEventListener('click',function(){if(isOpen())closeSheet();else openSheet(listHTML());});
document.getElementById('grab').addEventListener('click',function(){if(isOpen())closeSheet();else openSheet(listHTML());});
content.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  if(b.getAttribute('data-id'))select(b.getAttribute('data-id'),true);
  else if(b.getAttribute('data-act')==='focus'&&current){var g=svg.querySelector('[data-id="'+current+'"]');if(g){var p=posOf(g);focusOn(p.x,p.y);}}
  else if(b.getAttribute('data-act')==='list')openSheet(listHTML());});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&isOpen())closeSheet();});

/* filter */
RIDES.forEach(function(r){var g=svg.querySelector('[data-id="'+r.id+'"]');if(g)g.setAttribute('data-cat',r.cat);});
var chips=Array.prototype.slice.call(document.querySelectorAll('.chip[data-cat]'));
chips.forEach(function(c){c.addEventListener('click',function(){chips.forEach(function(x){x.classList.toggle('active',x===c);});var cat=c.getAttribute('data-cat');
  Array.prototype.forEach.call(svg.querySelectorAll('.ride'),function(g){g.classList.toggle('dim',cat!=='all'&&g.getAttribute('data-cat')!==cat);});
  if(current&&cat!=='all'&&byId[current]&&byId[current].cat!==cat)closeSheet();});});

/* animation toggle */
var animBtn=document.getElementById('anim'),paused=false;
function setPaused(p){paused=p;document.body.classList.toggle('paused',p);
  Array.prototype.slice.call(document.querySelectorAll('svg')).forEach(function(s){try{if(p)s.pauseAnimations();else s.unpauseAnimations();}catch(err){}});
  animBtn.textContent=p?'▶':'⏸';animBtn.setAttribute('aria-label',p?'Jalankan animasi':'Jeda animasi');}
animBtn.addEventListener('click',function(){setPaused(!paused);});
if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)setPaused(true);

/* tema: ikut sistem, terang, atau gelap */
var THEMES=[['auto','🌗 Auto','Tema mengikuti sistem'],['light','☀️ Terang','Tema terang'],['dark','🌙 Gelap','Tema gelap']];
var themeBtn=document.getElementById('theme'),themeIdx=0;
function applyTheme(i){themeIdx=((i%THEMES.length)+THEMES.length)%THEMES.length;var t=THEMES[themeIdx];
  if(t[0]==='auto')document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',t[0]);
  themeBtn.textContent=t[1];themeBtn.title=t[2];themeBtn.setAttribute('aria-label',t[2]+', ketuk untuk mengganti');
  try{localStorage.setItem('dufan-tema',t[0]);}catch(err){}}
(function(){var k=0;try{var saved=localStorage.getItem('dufan-tema');THEMES.forEach(function(t,i){if(t[0]===saved)k=i;});}catch(err){}applyTheme(k);})();
themeBtn.addEventListener('click',function(){applyTheme(themeIdx+1);});

/* bayangan lembut di bawah tiap wahana, dibuat sebagai lapisan sendiri supaya
   gambar wahana yang disalin ke kartu dan panel tetap bersih */
(function(){var host=document.getElementById('shadows');if(!host)return;
  Array.prototype.forEach.call(svg.querySelectorAll('.ride,.landmark'),function(g){
    var m=g.transform.baseVal.consolidate();if(!m)return;
    var hit=g.querySelector('.hit'),r=hit?parseFloat(hit.getAttribute('r'))||30:30;
    var e=document.createElementNS('http://www.w3.org/2000/svg','ellipse');
    e.setAttribute('class','rshadow');e.setAttribute('cx',m.matrix.e);e.setAttribute('cy',m.matrix.f+r*0.72);
    e.setAttribute('rx',(r*0.62).toFixed(1));e.setAttribute('ry',(r*0.19).toFixed(1));
    host.appendChild(e);});})();

/* logo: header, papan nama di peta */
fillLogos(document);
(function(){var sign=svg.querySelector('.slogo');
  if(sign)sign.setAttributeNS('http://www.w3.org/1999/xlink','href',LOGO.ancol);
  if(sign)sign.setAttribute('href',LOGO.ancol);})();

/* sea waves */
var waves=document.getElementById('waves');
[[24,''],[42,'w2'],[60,'w3']].forEach(function(w){var d='M-96,'+w[0];for(var i=0;i<20;i++)d+=' q12,-5 24,0 t24,0';
  var p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);p.setAttribute('class','a wave '+w[1]);waves.appendChild(p);});

stage.addEventListener('transitionend',function(e){if(e.propertyName==='right')relayout();});
fit();
